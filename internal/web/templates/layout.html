{{define "head"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Keystone MDM</title>
<style>
:root{color-scheme:light dark;
--bg:light-dark(#f4f5f7,#101317);--card:light-dark(#fff,#181c22);--ink:light-dark(#14181d,#e8eaee);
--muted:light-dark(#5d6673,#98a1ad);--line:light-dark(#e1e4e9,#262c35);
--brand:light-dark(#1f5fbf,#6ea4ff);--ok:light-dark(#137a43,#4cc98a);--bad:light-dark(#b42318,#ff7b6e);--unk:light-dark(#8a93a0,#6f7884)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding:14px max(4vw,16px);background:var(--card);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:var(--ink)}
.logo svg{width:28px;height:28px}
nav{display:flex;gap:18px;margin-left:auto}nav a{color:var(--muted);font-weight:500}nav a:hover{color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:28px max(4vw,16px) 64px}
h1{font-size:30px;line-height:1.1;margin:0 0 6px}h2{font-size:19px;margin:32px 0 12px}
.sub{color:var(--muted);margin:0 0 24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.stat b{display:block;font-size:34px;line-height:1.1}.stat span{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600}tr:last-child td{border-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--unk)}
.chip.ok::before{background:var(--ok)}.chip.bad::before{background:var(--bad)}.chip.bad{color:var(--bad);border-color:currentColor}
.muted{color:var(--muted);font-size:14px}
.empty{padding:40px 24px;text-align:center}
.grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.actions{display:grid;gap:10px;padding:16px}
.act{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:12px}
.act p{margin:2px 0 0;color:var(--muted);font-size:14px}
button,.btn{font:inherit;font-weight:600;min-height:40px;padding:8px 16px;border-radius:8px;border:1px solid var(--brand);background:var(--brand);color:#fff;cursor:pointer;white-space:nowrap}
button.ghost{background:transparent;color:var(--brand)}button.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
button:focus-visible,a:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.flash{background:light-dark(#e8f5ee,#12291d);border:1px solid var(--ok);border-radius:10px;padding:12px 16px;margin-bottom:20px}
ol li{margin-bottom:10px}code{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;overflow-wrap:anywhere}
.status-done{color:var(--ok)}.status-failed{color:var(--bad)}.status-queued,.status-sent{color:var(--muted)}
@media(max-width:600px){th.hide,td.hide{display:none}h1{font-size:26px}}
</style>
</head>
<body>
<header>
<a class="logo" href="/"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 26 9 6h14l5 20z" fill="var(--brand)"/><path d="M12 26l2-10h4l2 10z" fill="var(--card)"/></svg>Keystone MDM</a>
<span class="muted">{{.Org}}</span>
<nav><a href="/">Devices</a><a href="/enroll">Enroll a PC</a></nav>
</header>
<main>
{{end}}

{{define "foot"}}
</main>
</body>
</html>
{{end}}
